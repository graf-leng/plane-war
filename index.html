<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>飞机大战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #1a1a3e 0%, #0a0a1a 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #fff;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #wrap {
    position: relative;
    line-height: 0;
    box-shadow: 0 0 60px rgba(80, 120, 255, .25);
    border-radius: 10px;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #05050f;
    border-radius: 10px;
    cursor: crosshair;
  }
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(5, 5, 20, .82);
    backdrop-filter: blur(3px);
    text-align: center;
    padding: 24px;
    border-radius: 10px;
  }
  .hidden { display: none; }
  h1 {
    font-size: 52px;
    letter-spacing: 10px;
    background: linear-gradient(180deg, #fff, #7ec8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(80, 160, 255, .6);
    line-height: 1.3;
  }
  .sub { color: #9fb8ff; font-size: 15px; line-height: 2; }
  .keys { color: #6f86c8; font-size: 13px; line-height: 2; }
  button {
    margin-top: 8px;
    padding: 13px 46px;
    font-size: 19px;
    letter-spacing: 4px;
    color: #fff;
    background: linear-gradient(180deg, #3d7bff, #1e4fd6);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(61, 123, 255, .5);
    transition: transform .15s, box-shadow .15s;
    font-family: inherit;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(61,123,255,.65); }
  button:active { transform: translateY(1px); }
  .score-big {
    font-size: 40px;
    color: #ffd54f;
    text-shadow: 0 0 20px rgba(255,213,79,.5);
    line-height: 1.4;
  }
  .best { color: #8fa8e8; font-size: 15px; line-height: 1.8; }
  #muteBtn {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 10;
    width: 40px;
    height: 40px;
    padding: 0;
    margin: 0;
    border-radius: 50%;
    font-size: 18px;
    letter-spacing: 0;
    background: rgba(255,255,255,.12);
    box-shadow: none;
    border: 1px solid rgba(255,255,255,.25);
  }
  #muteBtn:hover { transform: none; background: rgba(255,255,255,.22); box-shadow: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="720"></canvas>
  <button id="muteBtn" title="声音开关">🔊</button>

  <div id="startScreen" class="screen">
    <h1>飞机大战</h1>
    <div class="sub">经典街机空战 · 无需安装 · 浏览器直接开战</div>
    <div class="keys">
      🖱️ 鼠标 / 触屏拖动控制飞机 &nbsp;·&nbsp; ⌨️ 方向键 / WASD 移动<br>
      🔥 自动射击 &nbsp;·&nbsp; 🎁 拾取道具强化火力 &nbsp;·&nbsp; ⏸ P 键暂停
    </div>
    <button id="startBtn">开始游戏</button>
    <div class="best" id="startBest"></div>
  </div>

  <div id="overScreen" class="screen hidden">
    <h1 style="font-size:40px; letter-spacing:6px;">游戏结束</h1>
    <div class="score-big" id="finalScore">0</div>
    <div class="best" id="overBest"></div>
    <button id="restartBtn">重新开始</button>
    <div class="keys">按 Enter 键也可重新开始</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- 基础 ----------
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;

  var startScreen = document.getElementById('startScreen');
  var overScreen = document.getElementById('overScreen');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');
  var muteBtn = document.getElementById('muteBtn');
  var finalScoreEl = document.getElementById('finalScore');
  var startBestEl = document.getElementById('startBest');
  var overBestEl = document.getElementById('overBest');

  var STATE = { START: 0, PLAYING: 1, PAUSED: 2, OVER: 3 };
  var state = STATE.START;

  // ---------- 音效（WebAudio 合成，无外部资源） ----------
  var audioCtx = null;
  var muted = false;

  function initAudio() {
    if (!audioCtx) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      } catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function tone(freq, dur, type, vol, slideTo) {
    if (muted || !audioCtx) return;
    try {
      var t0 = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + dur);
    } catch (e) { /* 忽略音频错误，不影响游戏 */ }
  }

  var sfx = {
    shoot: function () { tone(880, 0.07, 'square', 0.03, 620); },
    hit: function () { tone(220, 0.08, 'triangle', 0.05, 140); },
    boom: function () { tone(160, 0.28, 'sawtooth', 0.08, 40); },
    bigBoom: function () { tone(95, 0.5, 'sawtooth', 0.11, 30); tone(200, 0.38, 'square', 0.05, 50); },
    power: function () { tone(523, 0.1, 'triangle', 0.08, 523); tone(784, 0.18, 'triangle', 0.08, 784); },
    over: function () {
      tone(392, 0.25, 'square', 0.08, 196);
      setTimeout(function () { tone(196, 0.55, 'square', 0.08, 90); }, 230);
    }
  };

  // ---------- 存档 ----------
  function loadBest() {
    try { return Number(localStorage.getItem('planeWarBest')) || 0; }
    catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem('planeWarBest', String(v)); } catch (e) { /* ignore */ }
  }
  var best = loadBest();

  // ---------- 游戏对象 ----------
  var player, bullets, enemyBullets, enemies, particles, powerups, stars, texts;
  var score, lives, elapsed, spawnTimer, fireTimer, shake;

  function initStars() {
    stars = [];
    for (var i = 0; i < 80; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.6 + 0.3,
        speed: Math.random() * 60 + 20,
        alpha: Math.random() * 0.7 + 0.2
      });
    }
  }

  function resetGame() {
    player = {
      x: W / 2, y: H - 110,
      w: 40, h: 48,
      speed: 380,
      weapon: 1,       // 火力等级 1~3
      shield: 0,       // 护盾
      invincible: 0    // 无敌时间
    };
    bullets = [];
    enemyBullets = [];
    enemies = [];
    particles = [];
    powerups = [];
    texts = [];
    score = 0;
    lives = 3;
    elapsed = 0;
    spawnTimer = 0.8;
    fireTimer = 0;
    shake = 0;
  }

  // ---------- 输入 ----------
  var keys = Object.create(null);
  var pointer = { x: W / 2, y: H - 110, active: false };

  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'arrowdown' || k === 'arrowleft' || k === 'arrowright' || k === ' ') {
      e.preventDefault();
    }
    keys[k] = true;
    if (k === 'p' && (state === STATE.PLAYING || state === STATE.PAUSED)) {
      state = (state === STATE.PLAYING) ? STATE.PAUSED : STATE.PLAYING;
    }
    if (k === 'enter' && (state === STATE.START || state === STATE.OVER)) {
      startGame();
    }
  });
  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });

  function toCanvas(clientX, clientY) {
    var r = canvas.getBoundingClientRect();
    return {
      x: (clientX - r.left) * (W / r.width),
      y: (clientY - r.top) * (H / r.height)
    };
  }

  canvas.addEventListener('mousemove', function (e) {
    var p = toCanvas(e.clientX, e.clientY);
    pointer.x = p.x; pointer.y = p.y; pointer.active = true;
  });
  canvas.addEventListener('mouseleave', function () { pointer.active = false; });

  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    initAudio();
    var p = toCanvas(e.touches[0].clientX, e.touches[0].clientY);
    pointer.x = p.x; pointer.y = p.y; pointer.active = true;
  }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    var p = toCanvas(e.touches[0].clientX, e.touches[0].clientY);
    pointer.x = p.x; pointer.y = p.y; pointer.active = true;
  }, { passive: false });
  canvas.addEventListener('touchend', function () { pointer.active = false; });

  muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if (!muted) initAudio();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === STATE.PLAYING) state = STATE.PAUSED;
  });

  // ---------- 流程 ----------
  function startGame() {
    initAudio();
    resetGame();
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    state = STATE.PLAYING;
    lastTime = performance.now();
  }

  function gameOver() {
    state = STATE.OVER;
    if (score > best) { best = score; saveBest(best); }
    finalScoreEl.textContent = String(score);
    overBestEl.textContent = '历史最高分：' + best;
    startBestEl.textContent = best ? ('历史最高分：' + best) : '';
    overScreen.classList.remove('hidden');
    sfx.over();
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  // ---------- 工具 ----------
  function hit(a, b) {
    return Math.abs(a.x - b.x) * 2 < (a.w + b.w) && Math.abs(a.y - b.y) * 2 < (a.h + b.h);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function explode(x, y, color, count, speed) {
    for (var i = 0; i < count; i++) {
      var ang = Math.random() * Math.PI * 2;
      var sp = (Math.random() * 0.7 + 0.3) * (speed || 220);
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: Math.random() * 0.5 + 0.35,
        maxLife: 0.85,
        size: Math.random() * 4 + 1.5,
        color: color
      });
    }
  }

  function addText(x, y, str, color) {
    texts.push({ x: x, y: y, str: str, color: color, life: 1 });
  }

  // ---------- 敌机 ----------
  function spawnEnemy() {
    var t = Math.random();
    var diff = Math.min(1, elapsed / 90); // 难度成长
    if (t < 0.58) {
      enemies.push({
        type: 'small', w: 34, h: 34,
        x: 30 + Math.random() * (W - 60), y: -30,
        hp: 1, maxHp: 1,
        speed: 150 + Math.random() * 90 + diff * 120,
        score: 100, color: '#ff5252',
        sway: 0, swaySpeed: 0, phase: 0,
        shootTimer: Infinity
      });
    } else if (t < 0.88) {
      enemies.push({
        type: 'medium', w: 48, h: 48,
        x: 40 + Math.random() * (W - 80), y: -40,
        hp: 4, maxHp: 4,
        speed: 95 + Math.random() * 55 + diff * 70,
        score: 300, color: '#ff9800',
        sway: 40 + Math.random() * 50, swaySpeed: 1.2 + Math.random(),
        phase: Math.random() * Math.PI * 2,
        shootTimer: 1.2 + Math.random() * 1.6
      });
    } else {
      enemies.push({
        type: 'large', w: 84, h: 84,
        x: W / 2 + (Math.random() * 160 - 80), y: -80,
        hp: 14, maxHp: 14,
        speed: 45 + Math.random() * 25 + diff * 30,
        score: 1000, color: '#ab47bc',
        sway: 70 + Math.random() * 60, swaySpeed: 0.8 + Math.random() * 0.6,
        phase: Math.random() * Math.PI * 2,
        shootTimer: 1.8 + Math.random() * 1.2
      });
    }
  }

  function enemyShoot(e) {
    var dx = player.x - e.x, dy = player.y - e.y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    var sp = e.type === 'large' ? 200 : 240;
    if (e.type === 'large') {
      var base = Math.atan2(dy, dx);
      for (var k = -1; k <= 1; k++) {
        var ang = base + k * 0.28;
        enemyBullets.push({
          x: e.x, y: e.y + e.h / 2, w: 13, h: 13,
          vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp
        });
      }
    } else {
      enemyBullets.push({
        x: e.x, y: e.y + e.h / 2, w: 12, h: 12,
        vx: (dx / d) * sp, vy: (dy / d) * sp
      });
    }
  }

  function killEnemy(j, e) {
    enemies.splice(j, 1);
    score += e.score;
    addText(e.x, e.y, '+' + e.score, '#ffd54f');
    explode(e.x, e.y, e.color, e.type === 'large' ? 42 : 18, e.type === 'large' ? 320 : 230);
    if (e.type === 'large') { shake = 8; sfx.bigBoom(); }
    else sfx.boom();
    var dropChance = e.type === 'large' ? 0.9 : (e.type === 'medium' ? 0.22 : 0.06);
    if (Math.random() < dropChance) dropPowerup(e.x, e.y);
  }

  // ---------- 道具 ----------
  var POWER_TYPES = [
    { kind: 'weapon', label: 'W', color: '#ffd54f', desc: '火力升级' },
    { kind: 'shield', label: 'S', color: '#4fc3f7', desc: '能量护盾' },
    { kind: 'life',   label: 'L', color: '#66bb6a', desc: '生命 +1' },
    { kind: 'bomb',   label: 'B', color: '#ef5350', desc: '全屏清敌' }
  ];

  function dropPowerup(x, y) {
    var t = POWER_TYPES[Math.floor(Math.random() * POWER_TYPES.length)];
    powerups.push({
      x: x, y: y, w: 30, h: 30, vy: 80, t: 0,
      kind: t.kind, label: t.label, color: t.color, desc: t.desc
    });
  }

  function applyPowerup(p) {
    sfx.power();
    addText(p.x, p.y - 30, p.desc, p.color);
    if (p.kind === 'weapon') {
      player.weapon = Math.min(3, player.weapon + 1);
    } else if (p.kind === 'shield') {
      player.shield = 1;
    } else if (p.kind === 'life') {
      lives = Math.min(6, lives + 1);
    } else if (p.kind === 'bomb') {
      for (var i = enemies.length - 1; i >= 0; i--) {
        score += enemies[i].score;
        explode(enemies[i].x, enemies[i].y, enemies[i].color, 16, 260);
      }
      enemies.length = 0;
      enemyBullets.length = 0;
      shake = 12;
      sfx.bigBoom();
    }
  }

  // ---------- 玩家 ----------
  function playerShoot() {
    var y = player.y - player.h / 2;
    var sp = 620;
    if (player.weapon === 1) {
      bullets.push({ x: player.x, y: y, w: 8, h: 20, vx: 0, vy: -sp, damage: 1 });
    } else if (player.weapon === 2) {
      bullets.push({ x: player.x - 12, y: y, w: 8, h: 20, vx: 0, vy: -sp, damage: 1 });
      bullets.push({ x: player.x + 12, y: y, w: 8, h: 20, vx: 0, vy: -sp, damage: 1 });
    } else {
      bullets.push({ x: player.x, y: y, w: 8, h: 20, vx: 0, vy: -sp, damage: 1 });
      bullets.push({ x: player.x - 14, y: y, w: 8, h: 20, vx: -90, vy: -sp, damage: 1 });
      bullets.push({ x: player.x + 14, y: y, w: 8, h: 20, vx: 90, vy: -sp, damage: 1 });
    }
    sfx.shoot();
  }

  function playerHit() {
    if (state !== STATE.PLAYING) return;
    if (player.shield > 0) {
      player.shield = 0;
      player.invincible = 1.2;
      explode(player.x, player.y, '#4fc3f7', 18, 240);
      addText(player.x, player.y - 40, '护盾抵消!', '#4fc3f7');
      sfx.bigBoom();
      shake = 6;
      return;
    }
    lives -= 1;
    player.weapon = Math.max(1, player.weapon - 1);
    shake = 12;
    explode(player.x, player.y, '#42a5f5', 30, 300);
    sfx.bigBoom();
    if (lives <= 0) {
      lives = 0;
      gameOver();
    } else {
      player.invincible = 2.2;
      player.x = W / 2;
      player.y = H - 110;
    }
  }

  // ---------- 主更新 ----------
  function update(dt) {
    if (state !== STATE.PLAYING) return;
    elapsed += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 30);

    // 星空背景
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += s.speed * dt;
      if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    }

    // 玩家移动：键盘 / 鼠标 / 触屏
    var mv = player.speed * dt;
    var kb = false;
    if (keys['arrowleft'] || keys['a']) { player.x -= mv; kb = true; }
    if (keys['arrowright'] || keys['d']) { player.x += mv; kb = true; }
    if (keys['arrowup'] || keys['w']) { player.y -= mv; kb = true; }
    if (keys['arrowdown'] || keys['s']) { player.y += mv; kb = true; }
    if (!kb && pointer.active) {
      var k = Math.min(1, dt * 12);
      player.x += (pointer.x - player.x) * k;
      player.y += (pointer.y - player.y) * k;
    }
    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
    player.y = Math.max(player.h / 2, Math.min(H - player.h / 2, player.y));
    if (player.invincible > 0) player.invincible -= dt;

    // 自动开火
    fireTimer -= dt;
    if (fireTimer <= 0) {
      playerShoot();
      fireTimer = (player.weapon >= 3) ? 0.16 : 0.19;
    }

    // 敌机生成（难度递增）
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy();
      var base = Math.max(0.32, 1.05 - elapsed * 0.012);
      spawnTimer = base * (0.65 + Math.random() * 0.8);
    }

    // 子弹移动
    for (i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y < -30 || b.x < -30 || b.x > W + 30) bullets.splice(i, 1);
    }
    for (i = enemyBullets.length - 1; i >= 0; i--) {
      var eb = enemyBullets[i];
      eb.x += eb.vx * dt; eb.y += eb.vy * dt;
      if (eb.y > H + 30 || eb.y < -30 || eb.x < -30 || eb.x > W + 30) enemyBullets.splice(i, 1);
    }

    // 敌机移动 + 开火
    for (i = enemies.length - 1; i >= 0; i--) {
      var e = enemies[i];
      e.y += e.speed * dt;
      if (e.sway > 0) {
        e.phase += e.swaySpeed * dt;
        e.x += Math.cos(e.phase) * e.sway * dt;
        e.x = Math.max(e.w / 2, Math.min(W - e.w / 2, e.x));
      }
      e.shootTimer -= dt;
      if (e.shootTimer <= 0 && e.y > 20 && e.y < H * 0.75) {
        enemyShoot(e);
        e.shootTimer = (e.type === 'large') ? (1.7 + Math.random()) : (2 + Math.random() * 1.6);
      }
      if (e.y > H + 60) enemies.splice(i, 1);
    }

    // 我方子弹命中敌机
    for (i = bullets.length - 1; i >= 0; i--) {
      var bb = bullets[i];
      var consumed = false;
      for (var j = enemies.length - 1; j >= 0; j--) {
        var ej = enemies[j];
        if (hit(bb, ej)) {
          bullets.splice(i, 1);
          consumed = true;
          ej.hp -= bb.damage;
          explode(bb.x, bb.y, '#ffee58', 5, 120);
          if (ej.hp <= 0) {
            killEnemy(j, ej);
          } else {
            sfx.hit();
          }
          break;
        }
      }
      if (consumed) continue;
    }

    // 敌机子弹命中玩家
    if (state === STATE.PLAYING && player.invincible <= 0) {
      for (i = enemyBullets.length - 1; i >= 0; i--) {
        if (hit(player, enemyBullets[i])) {
          enemyBullets.splice(i, 1);
          playerHit();
          break;
        }
      }
    }

    // 敌机撞击玩家
    if (state === STATE.PLAYING && player.invincible <= 0) {
      for (i = enemies.length - 1; i >= 0; i--) {
        if (hit(player, enemies[i])) {
          var rammed = enemies[i];
          rammed.hp -= 2;
          if (rammed.hp <= 0) killEnemy(i, rammed);
          playerHit();
          break;
        }
      }
    }

    // 道具
    for (i = powerups.length - 1; i >= 0; i--) {
      var p = powerups[i];
      p.y += p.vy * dt;
      p.t += dt;
      if (p.y > H + 40) { powerups.splice(i, 1); continue; }
      if (hit(player, p)) {
        powerups.splice(i, 1);
        applyPowerup(p);
      }
    }

    // 粒子
    var drag = Math.pow(0.12, dt);
    for (i = particles.length - 1; i >= 0; i--) {
      var pt = particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= drag;
      pt.vy *= drag;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(i, 1);
    }

    // 飘字
    for (i = texts.length - 1; i >= 0; i--) {
      var tx = texts[i];
      tx.y -= 42 * dt;
      tx.life -= dt;
      if (tx.life <= 0) texts.splice(i, 1);
    }
  }

  // ---------- 绘制 ----------
  function drawPlayer() {
    var p = player;
    if (p.invincible > 0 && Math.floor(performance.now() / 90) % 2 === 0) return; // 无敌闪烁
    ctx.save();
    ctx.translate(p.x, p.y);

    // 尾焰
    var fl = 10 + Math.random() * 14;
    var grd = ctx.createLinearGradient(0, 16, 0, 16 + fl);
    grd.addColorStop(0, 'rgba(255,200,80,.95)');
    grd.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.moveTo(-7, 16); ctx.lineTo(0, 16 + fl); ctx.lineTo(7, 16);
    ctx.closePath(); ctx.fill();

    // 机翼
    ctx.fillStyle = '#39a0ff';
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(26, 12); ctx.lineTo(12, 20); ctx.lineTo(0, 8);
    ctx.lineTo(-12, 20); ctx.lineTo(-26, 12);
    ctx.closePath(); ctx.fill();

    // 机身
    var body = ctx.createLinearGradient(0, -30, 0, 24);
    body.addColorStop(0, '#ffffff');
    body.addColorStop(1, '#9fd4ff');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(0, -30);
    ctx.quadraticCurveTo(9, -8, 8, 14);
    ctx.lineTo(5, 24); ctx.lineTo(-5, 24); ctx.lineTo(-8, 14);
    ctx.quadraticCurveTo(-9, -8, 0, -30);
    ctx.closePath(); ctx.fill();

    // 座舱
    ctx.fillStyle = '#0277bd';
    ctx.beginPath();
    ctx.ellipse(0, -10, 4.5, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // 护盾
    if (p.shield) {
      ctx.strokeStyle = 'rgba(79,195,247,.85)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 38, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(79,195,247,.12)';
      ctx.fill();
    }
    ctx.restore();
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.type === 'small') {
      ctx.fillStyle = '#ff5252';
      ctx.beginPath();
      ctx.moveTo(0, 18); ctx.lineTo(18, -10); ctx.lineTo(7, -4);
      ctx.lineTo(-7, -4); ctx.lineTo(-18, -10);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#b71c1c';
      ctx.beginPath(); ctx.arc(0, 2, 5, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 'medium') {
      ctx.fillStyle = '#ff9800';
      ctx.beginPath();
      ctx.moveTo(0, 22); ctx.lineTo(24, -6); ctx.lineTo(14, -16);
      ctx.lineTo(-14, -16); ctx.lineTo(-24, -6);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e65100';
      ctx.fillRect(-10, -8, 20, 12);
      ctx.fillStyle = '#fff3e0';
      ctx.beginPath(); ctx.arc(0, -2, 5, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = '#ab47bc';
      ctx.beginPath();
      ctx.moveTo(0, 40); ctx.lineTo(30, 12); ctx.lineTo(42, -14); ctx.lineTo(24, -32);
      ctx.lineTo(-24, -32); ctx.lineTo(-42, -14); ctx.lineTo(-30, 12);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#6a1b9a';
      ctx.fillRect(-26, -18, 52, 22);
      ctx.fillStyle = '#f3e5f5';
      ctx.beginPath(); ctx.arc(0, -6, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff4081';
      ctx.fillRect(-22, 30, 10, 12); ctx.fillRect(12, 30, 10, 12);
    }
    // 血条（中/大型）
    if (e.type !== 'small' && e.hp < e.maxHp) {
      var bw = e.w * 0.8;
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.fillRect(-bw / 2, -e.h / 2 - 12, bw, 6);
      ctx.fillStyle = (e.hp / e.maxHp > 0.4) ? '#66bb6a' : '#ef5350';
      ctx.fillRect(-bw / 2, -e.h / 2 - 12, bw * (e.hp / e.maxHp), 6);
    }
    ctx.restore();
  }

  function drawPlayerBullet(b) {
    var g = ctx.createLinearGradient(b.x, b.y - 12, b.x, b.y + 12);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(1, 'rgba(120,200,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(b.x - 3, b.y - 12, 6, 20);
    ctx.fillStyle = '#fff';
    ctx.fillRect(b.x - 1.5, b.y - 10, 3, 14);
  }

  function drawEnemyBullet(b) {
    var g = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, 9);
    g.addColorStop(0, '#fff');
    g.addColorStop(0.35, '#ff5252');
    g.addColorStop(1, 'rgba(255,60,60,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 9, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPowerup(p) {
    ctx.save();
    ctx.translate(p.x, p.y + Math.sin(p.t * 3) * 3);
    ctx.rotate(Math.sin(p.t * 2) * 0.25);
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 16;
    ctx.fillStyle = p.color;
    roundRect(-15, -15, 30, 30, 8);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.font = 'bold 17px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.label, 0, 1);
    ctx.restore();
  }

  function drawHUD() {
    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('得分 ' + score, 16, 34);
    ctx.font = '13px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#8fa8e8';
    ctx.fillText('最高 ' + Math.max(best, score), 16, 56);

    ctx.textAlign = 'right';
    ctx.font = 'bold 20px sans-serif';
    for (var i = 0; i < lives; i++) {
      ctx.fillStyle = '#ff5b7a';
      ctx.fillText('❤', W - 18 - i * 26, 36);
    }

    ctx.textAlign = 'left';
    ctx.font = '13px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#ffd54f';
    ctx.fillText('火力 ' + '★'.repeat(player.weapon) + '☆'.repeat(3 - player.weapon), 16, H - 18);
    if (player.shield) {
      ctx.fillStyle = '#4fc3f7';
      ctx.fillText('🛡 护盾激活', 16, H - 42);
    }
    ctx.restore();
  }

  function drawPaused() {
    ctx.save();
    ctx.fillStyle = 'rgba(5,5,20,.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 40px "Microsoft YaHei", sans-serif';
    ctx.fillText('已暂停', W / 2, H / 2 - 20);
    ctx.font = '16px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#9fb8ff';
    ctx.fillText('按 P 键继续', W / 2, H / 2 + 26);
    ctx.restore();
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // 背景
    ctx.fillStyle = '#05050f';
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // 星星
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (i = 0; i < powerups.length; i++) drawPowerup(powerups[i]);
    for (i = 0; i < enemies.length; i++) drawEnemy(enemies[i]);
    for (i = 0; i < bullets.length; i++) drawPlayerBullet(bullets[i]);
    for (i = 0; i < enemyBullets.length; i++) drawEnemyBullet(enemyBullets[i]);

    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (state === STATE.PLAYING || state === STATE.PAUSED) drawPlayer();

    // 飘字
    for (i = 0; i < texts.length; i++) {
      var t = texts[i];
      ctx.globalAlpha = Math.max(0, t.life);
      ctx.fillStyle = t.color;
      ctx.font = 'bold 16px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(t.str, t.x, t.y);
    }
    ctx.globalAlpha = 1;

    drawHUD();
    ctx.restore();

    if (state === STATE.PAUSED) drawPaused();
  }

  // ---------- 主循环 ----------
  var lastTime = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
    lastTime = now;
    if (state === STATE.PLAYING) {
      update(dt);
    } else {
      // 菜单界面星空继续飘动
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        s.y += s.speed * dt * 0.5;
        if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
      }
    }
    render();
    requestAnimationFrame(frame);
  }

  // ---------- 启动 ----------
  initStars();
  resetGame();
  startBestEl.textContent = best ? ('历史最高分：' + best) : '';
  requestAnimationFrame(frame);
})();
</script>
</body>
